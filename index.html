<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
<title>状态栏 · 欲妈群</title>
<style>
:root{
  --c-bg:rgba(38,16,28,.94);
  --c-bg-2:rgba(24,10,20,.90);
  --c-surface:rgba(255,255,255,.06);
  --c-surface-2:rgba(255,255,255,.10);
  --c-text:#fff0f5;
  --c-text-muted:rgba(255,240,245,.72);
  --c-text-faint:rgba(255,240,245,.42);
  --c-primary:#F472B6;
  --c-primary-strong:#EC4899;
  --c-danger:#ef4444;
  --c-warn:#f59e0b;
  --c-safe:#10b981;
  --c-info:#60a5fa;
  --c-love:#f9a8d4;
  --c-border:rgba(244,114,182,.28);
  --c-border-2:rgba(244,114,182,.5);
  --c-track:rgba(255,255,255,.10);
  --c-btn:rgba(244,114,182,.12);
  --c-btn-hover:rgba(244,114,182,.24);
  --c-btn-active:rgba(236,72,153,.34);
  --shadow:0 2px 12px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --fs-xs:clamp(10px,2vw,11px);
  --fs-sm:clamp(11px,2.2vw,12px);
  --fs-base:clamp(12px,2.5vw,13px);
  --fs-md:clamp(13px,2.8vw,15px);
  --r:10px;
}
:root[data-theme="light"]{
  --c-bg:rgba(255,242,247,.96);
  --c-bg-2:rgba(255,232,241,.94);
  --c-surface:rgba(236,72,153,.06);
  --c-surface-2:rgba(236,72,153,.12);
  --c-text:#3b1b2a;
  --c-text-muted:rgba(59,27,42,.72);
  --c-text-faint:rgba(59,27,42,.45);
  --c-border:rgba(236,72,153,.26);
  --c-border-2:rgba(236,72,153,.45);
  --c-track:rgba(59,27,42,.10);
  --c-btn:rgba(236,72,153,.10);
  --c-btn-hover:rgba(236,72,153,.20);
  --c-btn-active:rgba(236,72,153,.30);
  --shadow:0 2px 10px rgba(180,60,120,.18);
}
*{box-sizing:border-box}
body{margin:0;padding:6px 8px 14px;background:transparent;font-family:var(--font);font-size:var(--fs-base);color:var(--c-text);-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;background:linear-gradient(160deg,var(--c-bg),var(--c-bg-2));border:1px solid var(--c-border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card{border-top:1px solid var(--c-border)}
.card:first-child{border-top:0}
.card-hd{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--c-surface);font-size:var(--fs-sm);font-weight:600;letter-spacing:.04em}
.card-hd .ico{width:15px;height:15px;flex:0 0 15px;fill:var(--c-primary)}
.card-hd .tag{margin-left:auto;font-weight:400;color:var(--c-text-faint);font-size:var(--fs-xs)}
.card-bd{padding:8px 10px 10px}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:var(--fs-sm)}
.row .k{color:var(--c-text-muted);flex:0 0 62px}
.row .v{color:var(--c-text);font-weight:600;word-break:break-all}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 10px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:4px 8px}
.bar{position:relative;height:7px;border-radius:4px;background:var(--c-track);overflow:hidden;flex:1 1 auto;min-width:60px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .35s ease}
.bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--c-text-faint);opacity:.7}
.lab{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--c-text-muted)}
.lab b{color:var(--c-text);font-weight:600;min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:var(--fs-xs);background:var(--c-btn);border:1px solid var(--c-border);color:var(--c-text)}
.pill.hot{background:rgba(236,72,153,.22);border-color:var(--c-border-2)}
.pill.warn{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.4)}
.pill.danger{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.42)}
.pill.safe{background:rgba(16,185,129,.16);border-color:rgba(16,185,129,.4)}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.mem{position:relative;padding:6px 4px;border:1px solid var(--c-border);border-radius:8px;background:var(--c-surface);text-align:center;cursor:pointer;user-select:none;min-height:44px;transition:.15s}
.mem:hover{background:var(--c-surface-2)}
.mem.on{border-color:var(--c-primary-strong);background:var(--c-btn-active)}
.mem .nm{font-size:var(--fs-sm);font-weight:600}
.mem .sub{font-size:var(--fs-xs);color:var(--c-text-faint)}
.mem .dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--c-safe)}
.mem .dot.off{background:var(--c-text-faint)}
.detail{margin-top:8px;padding:8px;border:1px dashed var(--c-border);border-radius:8px;background:var(--c-surface)}
.detail h4{margin:0 0 6px;font-size:var(--fs-sm);color:var(--c-love);font-weight:600}
.thought{margin:6px 0;padding:6px 8px;border-left:3px solid var(--c-primary);background:var(--c-surface);border-radius:0 6px 6px 0;font-size:var(--fs-sm);color:var(--c-text-muted);font-style:italic;line-height:1.5}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
button.act{min-height:44px;padding:6px 8px;border-radius:9px;border:1px solid var(--c-border);background:var(--c-btn);color:var(--c-text);font-family:var(--font);font-size:var(--fs-sm);cursor:pointer;transition:.15s}
button.act:hover{background:var(--c-btn-hover)}
button.act:active{background:var(--c-btn-active);transform:scale(.98)}
button.act.refuse{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.14)}
button.act small{display:block;font-size:var(--fs-xs);color:var(--c-text-faint);font-weight:400}
.opt-head{margin:6px 0;color:var(--c-text-faint);font-size:var(--fs-xs);line-height:1.5}
.opts{display:grid;gap:6px;margin-bottom:8px}
button.opt{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid var(--c-border);background:var(--c-surface);color:var(--c-text);font-family:var(--font);font-size:var(--fs-sm);line-height:1.55;cursor:pointer;transition:.15s}
button.opt:hover{background:var(--c-btn-hover)}
button.opt.picked{border-color:var(--c-primary-strong);background:var(--c-btn-active);box-shadow:inset 0 0 0 1px var(--c-primary-strong)}
button.opt b{color:var(--c-primary-strong);margin-right:5px}
button.opt small{display:block;margin-top:3px;font-size:var(--fs-xs);color:var(--c-text-faint);font-weight:400}
button.act:disabled{opacity:.45;cursor:not-allowed}
.verdict{margin:8px 0 0;padding:8px;border-radius:8px;border:1px solid var(--c-border);background:var(--c-surface);font-size:var(--fs-sm);line-height:1.6}
.verdict .big{font-size:var(--fs-md);font-weight:700}
.rounds{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rd{flex:1 1 80px;padding:5px 6px;border-radius:7px;background:var(--c-surface-2);text-align:center;font-size:var(--fs-xs);line-height:1.45}
.rd b{display:block;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.hist{margin-top:6px}
.hist details{border:1px solid var(--c-border);border-radius:8px;background:var(--c-surface);padding:6px 8px}
.hist summary{cursor:pointer;font-size:var(--fs-sm);color:var(--c-text-muted)}
.hist .h{margin:6px 0;padding:5px 0;border-top:1px dashed var(--c-border);font-size:var(--fs-xs);line-height:1.55;color:var(--c-text-muted)}
.btn-min{min-height:36px;padding:4px 10px;border-radius:8px;border:1px solid var(--c-border);background:var(--c-btn);color:var(--c-text);font-family:var(--font);font-size:var(--fs-sm);cursor:pointer}
.btn-min.on{background:var(--c-btn-active);border-color:var(--c-border-2)}
.hd-btn{width:30px;height:30px;margin-left:auto;border-radius:8px;border:1px solid var(--c-border);background:var(--c-btn);color:var(--c-text);cursor:pointer;font-size:13px;line-height:1}
.hd-btn.spin{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:8px;color:var(--c-text-faint);font-size:var(--fs-sm);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="root"><div class="empty">状态栏加载中…</div></div>
<script>
(function(){
"use strict";
/* ====== lodash 兜底（host 未挂 _ 时 render 不崩）====== */
if(!window._||typeof window._.get!=="function"){
  window._={get:function(o,p,d){try{var a=String(p).split("."),c=o;for(var i=0;i<a.length;i++){if(c==null)return d;c=c[a[i]]}return c===undefined?d:c}catch(e){return d}},
  clamp:function(v,a,b){return Math.min(b,Math.max(a,v))},isArray:Array.isArray,keys:Object.keys,values:Object.values};
}
var _=window._;

/* ====== 默认兜底（仅未初始化时用，不与 schema 抢真值）====== */
var DEFAULT_STAT={元数据:{日数:1,小时:23,时段:"夜晚",回合:0,难度:"普通",高考日:100},
 玩家:{姓名:"",年龄:18,学校:"上海市上海中学",学业:{成绩:50},
   身体:{体力:80,性欲:75,不应期:30},
   心理:{理智:90,欲望:0,兴奋:0,怀疑:5},
   技能:{观察:10,行动:8,意志:15},
   察觉值:{假阳具真相:0,群存在:0,母亲欲望:0,幻触:5},
   今日:{射精次数:0,幻触次数:0},警觉度:0,证据清单:"",_本轮判定:{}},
 郝佳期:{姓名:"郝佳期",年龄:32,群等级:3,积分:0,阶段:1,阶段进度:0,
   心理:{兴奋:0,润滑:0,理智:100,痴迷:0,罪恶感:0,勇气:50,暴露恐惧:0,此刻想法:""},
   关系:{亲密度:50,信任度:60,边界:100,叛逆恐惧:80},
   统计:{偷抚次数:0,诱导射精:0,假阳具使用:0,暴露次数:0},
   竞赛:{今日排名:null,今日得分:0},
   后门类型:"情感缺口",后门描述:"",后门策略:"",后门目标:"主角",后门已发现:false,后门已利用:false,后门进度:0},
 假阳具:{当前持有者:"hao_jiaqi",持有起始日:1,持有到期日:7,绑定目标:"主角",共感强度:100,今日使用:0,上次使用时:-12,是否激活:true,借用者:"",借用期限:0},
 群:{成员数:12,在线数:8,活跃度:78,今日主题:"",今日主题索引:0,"30天已用主题":"",竞赛进行中:true,秘密任务:{成员:"",内容:"",期限日:0,进行中:false},暴露风险:0,联盟:{},周冠军UID:"hao_jiaqi",周竞赛历史:"",成员详情:{}},
 阶段守卫:{已锁定:false,结局已触发:false,结局类型:null,后日谈已读:false},
 设置:{主题:"夜间"}};

var S={stat:null,msgId:null,source:"?",open:"hao_jiaqi",theme:"夜间",busy:false,pick:""};
var UID_ORDER=["hao_jiaqi","su_mei","lin_wanqing","su_qing","han_xue","bai_lu","tao_tao","lian_nai","you_zi","xiao_ye","qin_yu","ling"];
var SKILLS={观察:{dc:12},行动:{dc:10},意志:{dc:12}};
/* 群周派对·群P 门槛：阶段5 且 完全暴露100（郝佳期取 玩家.察觉值.母亲欲望，其他成员取 暴露度） */
// 每档能做到哪一步（服务玩法：玩家据此决定拦哪一条）
var STAGE_LINE = {
  1: "只能擦边：走光、凑近、借位置贴上来；手不落在他身上",
  2: "能趁睡动手：偷抚、口交、偷拍；他睁眼就全停",
  3: "能摆到明面上：体检／教学／示范这类名义之内全套都行，名义之外一步都不行",
  4: "那道线断了：只要一句称呼；能往外说（群内晒、带出场）",
  5: "没边界了：任意时间地点，公开也不避人；由她定什么时候停"
};
function exposureOf(uid){
  if(uid==="hao_jiaqi") return pct(g("玩家.察觉值.母亲欲望",0));
  var d=g("群.成员详情."+uid,null);
  return d?pct(d.暴露度):0;
}
function stageOf(uid){
  if(uid==="hao_jiaqi") return num(g("郝佳期.阶段",1),1);
  var d=g("群.成员详情."+uid,null);
  return d?num(d.阶段,1):1;
}
function partyReady(uid){ return stageOf(uid)>=5 && exposureOf(uid)>=100; }

/* ====== MVU 读写 ====== */
function lastMsgId(){
  try{ if(typeof getLastMessageId==="function") return getLastMessageId(); }catch(e){}
  try{ var f=window.frameElement; if(f&&f.closest){var m=f.closest(".mes"); if(m&&m.getAttribute("mesid")!=null) return Number(m.getAttribute("mesid"));} }catch(e){}
  return null;
}
async function readStat(){
  var id=lastMsgId();
  if(id==null) throw new Error("找不到楼层号");
  S.msgId=id;
  if(window.Mvu&&Mvu.getMvuData){
    var d=await Mvu.getMvuData({type:"message",message_id:id});
    if(d&&d.stat_data) return d.stat_data;
    if(d&&d.元数据) return d;
  }
  if(typeof getVariables==="function"){
    var v=getVariables({type:"message",message_id:id});
    if(v&&v.stat_data) return v.stat_data;
    if(v&&v.元数据) return v;
  }
  return null;
}
async function writeStat(mut){
  var id=(S.msgId!=null)?S.msgId:lastMsgId();
  if(id==null) return false;
  var data=null;
  if(window.Mvu&&Mvu.getMvuData) data=await Mvu.getMvuData({type:"message",message_id:id});
  if(!data&&typeof getVariables==="function") data=getVariables({type:"message",message_id:id});
  if(!data) return false;
  var box=data.stat_data?data.stat_data:(data.元数据?data:null);
  if(!box) return false;
  mut(box);
  try{
    if(window.Mvu&&Mvu.replaceMvuData){ await Mvu.replaceMvuData(data,{type:"message",message_id:id}); }
    else if(typeof replaceVariables==="function"){ await replaceVariables(data,{type:"message",message_id:id}); }
    else return false;
    return true;
  }catch(e){ console.warn("[欲妈群] 写入失败",e); return false; }
}

/* ====== 工具 ====== */
function g(p,d){ return _.get(S.stat,p,d); }
function num(v,d){ var n=Number(v); return isFinite(n)?n:(d||0); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]}); }
function pct(v){ return Math.max(0,Math.min(100,num(v,0))); }
function bar(v,color,marks){
  var n=pct(v),h='<span class="bar"><i style="width:'+n+'%;background:'+(color||"var(--c-primary)")+'"></i>';
  (marks||[]).forEach(function(m){ h+='<span class="mk" style="left:'+m+'%"></span>'; });
  return h+"</span>";
}
function lab(name,v,color,marks){
  return '<div class="lab"><span style="flex:0 0 52px">'+esc(name)+'</span>'+bar(v,color,marks)+'<b>'+Math.round(pct(v))+'</b></div>';
}
function pill(t,cls){ return '<span class="pill '+(cls||"")+'">'+esc(t)+"</span>"; }
var ICON={
  him:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 3a4 4 0 100 8 4 4 0 000-8zm0 10c-4 0-7 2.2-7 5v3h14v-3c0-2.8-3-5-7-5z"/></svg>',
  mom:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 2l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM5 17l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/></svg>',
  grp:'<svg class="ico" viewBox="0 0 24 24"><path d="M8 11a3 3 0 100-6 3 3 0 000 6zm8 0a3 3 0 100-6 3 3 0 000 6zM2 20v-1c0-2.2 2.7-4 6-4s6 1.8 6 4v1H2zm13 0v-1c0-1.4-.6-2.6-1.7-3.5 1.1-.3 2.2-.5 3.7-.5 2.2 0 4 1.3 4 3v2h-6z"/></svg>',
  toy:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 2a6 6 0 016 6v5l2 4v3H4v-3l2-4V8a6 6 0 016-6z"/></svg>',
  dice:'<svg class="ico" viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2zm3 3a1.6 1.6 0 100 3.2A1.6 1.6 0 008 6zm8 0a1.6 1.6 0 100 3.2A1.6 1.6 0 0016 6zm-8 9a1.6 1.6 0 100 3.2A1.6 1.6 0 008 15zm8 0a1.6 1.6 0 100 3.2A1.6 1.6 0 0016 15zm-4-5a1.6 1.6 0 100 3.2A1.6 1.6 0 0012 10z"/></svg>',
  cog:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9 4l-2 .6a7 7 0 01-.8 2l1 1.8-1.4 1.4-1.8-1a7 7 0 01-2 .8L13 21h-2l-.6-2a7 7 0 01-2-.8l-1.8 1L5.2 18l1-1.8a7 7 0 01-.8-2L3 13v-2l2-.6a7 7 0 01.8-2l-1-1.8L6.2 5.2l1.8 1a7 7 0 012-.8L11 3h2l.6 2a7 7 0 012 .8l1.8-1 1.4 1.4-1 1.8a7 7 0 01.8 2L21 11z"/></svg>'
};
function hd(icon,title,tag){
  return '<div class="card-hd">'+ICON[icon]+'<span>'+esc(title)+'</span>'+(tag?'<span class="tag">'+esc(tag)+"</span>":"")+'<button class="hd-btn'+(S.busy?" spin":"")+'" data-act="refresh">✦</button></div>';
}

/* ====== LCG 确定性骰子（与 D20 条目·十三 一致）====== */
/* ══ 确定性骰（2026-09-22 重做：原实现是坏的）══
   两个实测出来的硬伤：
   ① 原式 (seed*1103515245+12345)%2^31 —— seed 到 1e8 时乘积 1.1e17 已超 2^53，双精度丢精度 → 改用 Math.imul 做 32 位乘法。
   ② 更严重：原 rollAt 用 (lcg(base+kn*97)%20) —— LCG 相邻 seed 的差模 2^31 是常数，取模 20 后几乎不变，
      实测 2040 个 base 只产出 **1 种**三轮组合：三次投掷永远相同，「三轮骰」等于没掷。
   现方案：lcg 取值先做 murmur3 收尾混合（雪崩），再取模 —— 实测单轮 20/20 取值全覆盖、偏差 8.9%、三轮组合 1792 种。
   仍是纯函数：同一个 (日数,小时,回合,动作序号) 永远同一结果 → 防 SL 大法。 */
function lcg(seed){ var x=(Math.imul(seed,1103515245)+12345)%2147483648; if(x<0)x+=2147483648; return x; }
function mix32(x){ x=Math.imul(x^(x>>>16),2246822507); x=Math.imul(x^(x>>>13),3266489909); return (x^(x>>>16))>>>0; }
function rollAt(base,kn){ return (mix32(lcg(base)+kn*7919)%20)+1; }
function grade(t){ if(t<=5)return "大失败"; if(t<=10)return "失败"; if(t<=15)return "部分成功"; if(t<=19)return "成功"; return "大成功"; }

function renderVerdict(v){
  var cls=({"大失败":"danger","失败":"warn","部分成功":"","成功":"safe","大成功":"hot"})[v.综合]||"";
  var s='<div class="verdict"><span class="big">'+pill(v.综合,cls)+'</span> <span style="color:var(--c-text-faint)">'+esc(v.行为)+"</span>";
  if(v.投掷&&v.投掷.length){
    s+='<div class="rounds">';
    ["侦察","行动","反应"].forEach(function(nm,i){
      if(v.投掷[i]==null) return;
      s+='<div class="rd">'+nm+"<b>"+num(v.投掷[i])+"</b></div>";
    });
    s+="</div>";
  }
  if(num(v.警觉)) s+='<div style="margin-top:5px">警觉度 +'+num(v.警觉)+"</div>";
  if(v.说明) s+='<div style="margin-top:3px">'+esc(v.说明)+"</div>";
  return s+'<div style="margin-top:5px;color:var(--c-text-faint);font-size:var(--fs-xs)">判定已写入变量，AI 不重算、不质疑</div></div>';
}

/* ====== 行动：跑骰并写变量 ====== */
/* ★ 推送链路（照 同级生2）：写进输入框 → 停一下让他看见 → 带内容发送 → 触发下一楼
   坑：/send 必须带参数，裸 /send 会发空值。 */
async function 推给AI(要发){
  try{
    if(typeof triggerSlash==="function"){
      await triggerSlash("/setinput "+JSON.stringify(要发));
      await new Promise(function(r){setTimeout(r,260);});
      await triggerSlash("/send "+JSON.stringify(要发));
      await triggerSlash("/trigger");
    }else{
      var ta=document.querySelector("#send_textarea")||(window.parent&&window.parent.document.querySelector("#send_textarea"));
      if(ta){ ta.value=要发; ta.dispatchEvent(new Event("input",{bubbles:true})); }
      if(typeof createChatMessages==="function"){ await createChatMessages([{role:"user",content:要发}]); }
    }
    return true;
  }catch(e){ console.error("[欲妈群] 推送失败",e); S.source="推送失败"; return false; }
}

/* 执行 / 拒绝她摆的那一条：判定 → 写变量 → 推给 AI */
async function 执行选项(模式){
  if(S.busy) return;
  var k=S.pick;
  if(!k){ S.source="先选一条"; render(); return; }
  var 局=g("局面",{}), o=((局.当前选项||{})[k])||{};
  var 文本=String(o.文本||"").trim();
  if(!文本){ S.source="这一条是空的"; render(); return; }
  var 等级=String(o.等级||"微");
  var dcMap={微:12,中:15,强:18,极:22};
  var skill=(模式==="refuse")?"意志":"行动";
  var 头=(模式==="refuse")
    ? "【我这轮的动作】我拒绝她摆的第"+k+"条：「"+文本+"」。"
    : "【我这轮的动作】她摆的第"+k+"条：「"+文本+"」（"+等级+"级）。我按了执行。";
  await doRoll(skill, 头, dcMap[等级]||12);
  /* 处理过的这一格清空；执行则记下她已选 */
  try{
    await writeStat(function(box){
      box.局面=box.局面||{}; box.局面.当前选项=box.局面.当前选项||{};
      box.局面.当前选项[k]={文本:"",等级:"微",代价:""};
      if(模式==="exec") box.局面.她已选=k;
    });
  }catch(e){ console.warn("[欲妈群] 清格子失败",e); }
  S.pick="";
  await refresh(false);
}

async function doRoll(skill, 追发, 强制dc){
  if(S.busy) return; S.busy=true; render();
  try{
    var p=g("玩家",{}), h=g("郝佳期",{}), m=g("元数据",{});
    var day=num(m.日数,1), hour=num(m.小时,0), turn=num(m.回合,0);
    var order=["观察","行动","意志","拒绝","后门反抗"];
    var idx=Math.max(1,order.indexOf(skill)+1);
    var base=day*1000000+hour*10000+turn*100+idx*10;
    var isBack=(skill==="后门反抗");
    var 技=isBack?num((p.技能||{}).观察,0):num((p.技能||{})[skill],0);
    var pExp=num((p.心理||{}).兴奋,0), pWill=num((p.技能||{}).意志,0), pSan=num((p.心理||{}).理智,90), pDes=num((p.心理||{}).欲望,0);
    var hBrain=num((h.心理||{}).理智,100), hCou=num((h.心理||{}).勇气,50), hObs=num((h.心理||{}).痴迷,0), hExp=num((h.心理||{}).兴奋,0), hTrust=num((h.关系||{}).信任度,60);
    var hBack=num(h.后门进度,0);
    /* ══ 三档难度参数（2026-09-22；脚本 _work/check/_diff_search*.mjs）══
       目标：普通=势均力敌（60/75/90）｜困难=他慢慢占上风但一直被压（35/52/73）｜地狱=她绝对压制
       dk=DC 系数｜D=三轮修正｜gw=他的成长权重｜hk=她的增益 */
    var DIFF={"普通":{dk:0.20,D: 0,gw:0.5,hk:0.6},
              "困难":{dk:0.25,D:-2,gw:0.7,hk:0.8},
              "地狱":{dk:0.30,D:-4,gw:0.4,hk:0.8}};
    var df=DIFF[String(g("元数据",{}).难度||"普通")]||DIFF["困难"];
    var dc=Math.round((强制dc||(SKILLS[skill]?SKILLS[skill].dc:(isBack?15:12)))*df.dk);
    var 他观察=num((p.技能||{}).观察,10), 他意志=num((p.技能||{}).意志,15);
    var 他理智=num((p.心理||{}).理智,90), 他警觉=num(p.警觉度,0);
    var willFix=(skill==="拒绝"||skill==="意志")?Math.round((pSan-pDes)/10):0;
    var backFix=isBack?Math.round(hBack/10):0;
    /* ══ 三轮修正：直接按设计表换算成「他的得分」══
       （设计表 D20对抗判定系统 · 六 状态修正速查 是写在【她的总分】上的，取负就是他的得分）
       侦察轮 = 她兴奋藏不住(+a/20) − 她勇气(+c/10) + 他理智(+s/20) + 他警觉(+al/10) + 他观察技能
       行动轮 = 他技能 − DC×dk − 她痴迷(o/10)
       反应轮 = 他意志(+w/5) + 她信任心软(+t/10) + 后门受制(+b/20) − 她兴奋(a/10) − 她勇气(c/20)
       ★ 判据（用户 2026-09-22 确认）：她越有勇气、越痴迷 → 他越容易失败 ⇒ 她的项一律取负。
       注意「侦察轮的她兴奋」是唯一例外：她越兴奋越藏不住 → 对他有利 → 取正。 */
    var m1=Math.round(hExp*df.hk/20)-Math.round(hCou*df.hk/10)+Math.round(他理智/20)+Math.round(他警觉/10)+Math.round(他观察*df.gw/5)+df.D;
    var m2=Math.round(技*df.gw/5)-dc-Math.round(hObs*df.hk/10)+willFix+backFix+df.D;
    var m3=Math.round(他意志*df.gw/5)+Math.round(hTrust*df.hk/10)+Math.round(hBack/20)-Math.round(hExp*df.hk/10)-Math.round(hCou*df.hk/20)+df.D;
    /* ══ 聚合（2026-09-22 改，第三版）：加权 (v1 + 2·v2 + v3) / 4 → 直接判档
       为什么要加权：v2 是他这一下（行动轮），权重给 2；侦察/反应各给 1。
       为什么不要“中位档”和“全好才大成功”这类额外规则：中位档会让 v2 的极值作废
       （后期 m2 再高也没用），而“三轮全好→大成功”在后期太容易触发（大成功 51% > 成功）。
       现在的实测分布（困难后期）：部分 47.1 / 成功 31.9 / 大成功 16.7 / 大失败 0 —— 顺了。 */
    var rolls=[rollAt(base,1),rollAt(base,2),rollAt(base,3)], mods=[m1,m2,m3], grades=[];
    var _v=[rolls[0]+m1,rolls[1]+m2,rolls[2]+m3];
    for(var i=0;i<3;i++) grades.push(grade(_v[i]));
    var 综合=grade(Math.round((_v[0]+2*_v[1]+_v[2])/4));
    var backOk=isBack&&(综合==="成功"||综合==="大成功")&&hBack>=80;
    var 警觉=isBack?(backOk?-(5+((day*13+turn*7)%11)):(DELTA[综合]||0)):(DELTA[综合]||0);
    var _ev="";
    try{
      if(bad>=2){ var _k=((day*7+hour*3+turn)%EVENT_BAD.length); _ev="｜抽到事件："+EVENT_BAD[_k]; }
      else if(good>=2){ var _k2=((day*11+hour*5+turn)%EVENT_GOOD.length); _ev="｜抽到事件："+EVENT_GOOD[_k2]; }
    }catch(e){}
    var 说明=isBack
      ? (backOk?"拿攥住的弱点换一次退让：今晚不做／她自己动手／把话说破逼她收手／换一次谈判，四选一。她同意这一次，三天后再换一条路走。"
        :(hBack<80?"弱点还没攥热，她一句话就把你顶回去。":"话没说到点上，她笑着把话岔开了。"))
      : (skill==="拒绝"?"拦住她正要做的这件事。":"")+(bad>=2?"连续失手，痕迹留在现场。":(good>=2?"一气呵成，几乎没留痕迹。":"勉强过关，代价记在账上。"));
    var rec="Day"+day+" "+String(hour).padStart(2,"0")+":00 · "+skill+" · "+综合+(警觉?" · 警觉+"+警觉:"")+(backOk?" · 后门已利用":"");
    var ok=await writeStat(function(box){
      box.玩家=box.玩家||{};
      box.玩家.警觉度=Math.min(100,Math.max(0,num(box.玩家.警觉度,0)+警觉));
      box.玩家._本轮判定={行为:skill,投掷:rolls,综合:综合,警觉:警觉,说明:说明};
      /* ★ 技能成长也走面板（AI 不碰）：大成功 +5 ／ 成功 +3 ／ 其余 +2，上限 100 */
      if(skill==="观察"||skill==="行动"||skill==="意志"){
        var _g=(综合==="大成功"?5:(综合==="成功"?3:2));   /* 2026-09-22：+1~3 太慢（17 天到不了 40）→ +2~5 */
        box.玩家.技能=box.玩家.技能||{};
        box.玩家.技能[skill]=Math.min(100,num(box.玩家.技能[skill],0)+_g);
      }
      if(backOk){
        box.郝佳期=box.郝佳期||{}; box.郝佳期.心理=box.郝佳期.心理||{};
        box.郝佳期.后门已利用=true;
        box.郝佳期.心理.暴露恐惧=Math.min(100,Math.max(0,num(box.郝佳期.心理.暴露恐惧,0)-(5+((day*3+turn)%6))));
        box.郝佳期.心理.痴迷=Math.min(100,Math.max(0,num(box.郝佳期.心理.痴迷,0)+(2+((day+turn)%4))));
      }
    });
    if(!ok) S.source="写入失败";
    /* ★ 判定完就把结果推给 AI —— AI 只负责写这一轮，不再自己掷骰 */
    if(追发){
      var 摘要=追发
        +"\n【判定】Day"+day+" "+String(hour).padStart(2,"0")+":00 · "+skill+" · DC"+dc
        +" · 三轮 "+rolls.join("/")+"（修正 "+mods.map(function(x){return x>=0?"+"+x:""+x;}).join("/")+"）"
        +" · 综合 "+综合+(警觉?" · 警觉"+(警觉>0?"+":"")+警觉:"")
        +"\n【结果】"+说明
        +"\n★ 按上面这个结果写这一轮：你不是裁判，不要自己另掷骰、不要改数值、不要重算。";
      await 推给AI(摘要);
    }
    await refresh(false);
  }catch(e){ console.warn("[欲妈群] 判定失败",e); S.source="判定失败"; }
  finally{ S.busy=false; render(); }
}
async function setVar(path,val){
  var ok=await writeStat(function(box){
    var a=path.split("."),c=box;
    for(var i=0;i<a.length-1;i++){ if(typeof c[a[i]]!=="object"||c[a[i]]===null) c[a[i]]={}; c=c[a[i]]; }
    c[a[a.length-1]]=val;
  });
  if(ok) await refresh(false);
  return ok;
}

/* ====== 事件 ====== */
document.addEventListener("click",function(ev){
  var mem=ev.target.closest("[data-uid]");
  if(mem){ S.open=mem.getAttribute("data-uid"); render(); return; }
  var el=ev.target.closest("[data-act]"); if(!el) return;
  var act=el.getAttribute("data-act");
  if(act==="refresh") refresh(true);
  else if(act==="roll") doRoll(el.getAttribute("data-skill"));
  else if(act==="pick"){ S.pick=(S.pick===el.getAttribute("data-k"))?"":el.getAttribute("data-k"); render(); }
  else if(act==="exec") 执行选项("exec");
  else if(act==="refuse") 执行选项("refuse");
  else if(act==="theme"){ S.theme=el.getAttribute("data-val"); applyTheme(); render(); setVar("设置.主题",S.theme); }
},false);
function applyTheme(){
  document.documentElement.setAttribute("data-theme",S.theme==="浅色"?"light":"dark");
  try{ localStorage.setItem("yumq-status-theme",S.theme); }catch(e){}
}
function loadTheme(){
  var t=S.theme;
  try{ var v=localStorage.getItem("yumq-status-theme"); if(v==="夜间"||v==="浅色") t=v; }catch(e){}
  var st=g("设置",{}); if(st&&(st.主题==="夜间"||st.主题==="浅色")) t=st.主题;
  S.theme=t; applyTheme();
}
async function refresh(showBusy){
  if(showBusy){ S.busy=true; render(); }
  try{
    var st=await readStat();
    if(st){ S.stat=st; S.source="MVU"; } else { S.stat=DEFAULT_STAT; S.source="默认"; }
  }catch(e){
    S.stat=DEFAULT_STAT; S.source="未初始化";
    console.warn("[欲妈群] 读取失败，走默认值",e);
  }finally{ S.busy=false; }
  try{ await maintainLedger(); }catch(e){ console.warn("[欲妈群] 记账失败",e); }
  loadTheme(); render();
}
/* 系统记账：这三个列表由面板维护，变量模型不写。
   （Zod 卡拿不到 extensible，AI 只要对数组用 add 就会被 MVU 判 SCHEMA 违规） */
async function maintainLedger(){
  var box=S.stat||DEFAULT_STAT, gr=box.群||{}, md=box.元数据||{};
  var theme=String(gr.今日主题||"").trim(); if(!theme) return;
  var day=num(md.日数,1), weekStart=Math.max(1, day-((day-1)%7));
  var champ=String(gr.周冠军UID||""), champName=(champ==="hao_jiaqi")?"郝佳期":nameOf(champ);
  var needUsed=String(gr["30天已用主题"]||"").split("、").filter(Boolean).indexOf(theme)<0;
  var hist=String(gr.周竞赛历史||"").split("；").filter(Boolean);
  var needWeek=(day%7===0)&&!!champ&&!hist.some(function(x){return x.split("|")[0]===String(weekStart);});
  if(!needUsed&&!needWeek) return;
  await writeStat(function(b){
    b.群=b.群||{};
    if(needUsed){
      var a=String(b.群["30天已用主题"]||"").split("、").filter(Boolean);
      if(a.indexOf(theme)<0) a.push(theme);
      b.群["30天已用主题"]=a.slice(-30).join("、");
    }
    if(needWeek){
      var c=String(b.群.周竞赛历史||"").split("；").filter(Boolean);
      if(!c.some(function(x){return x.split("|")[0]===String(weekStart);})) c.push(weekStart+"|"+champName);
      b.群.周竞赛历史=c.slice(-8).join("；");
    }
  });
  S.stat=null; var st=await readStat(); if(st) S.stat=st;
}

/* ====== 初始化（防重复挂载）====== */
function init(){
  if(window.__yumqMounted) return;
  window.__yumqMounted=true;
  refresh(true);
  try{
    if(typeof eventOn==="function"){
      ["message_received","message_updated","message_swiped","chat_changed","message_deleted"].forEach(function(ev){
        try{ eventOn(ev,function(){ refresh(false); }); }catch(e){}
      });
    }
  }catch(e){}
  try{
    var obs=new MutationObserver(function(){
      var id=lastMsgId();
      if(id!=null&&id!==S.msgId){ S.msgId=id; refresh(false); }
    });
    if(document.body) obs.observe(document.body,{childList:true,subtree:true});
  }catch(e){}
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
})();
</script>
