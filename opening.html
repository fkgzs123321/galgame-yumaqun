<body>
<style>
  .ymq-open{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;max-width:560px;margin:14px auto;padding:16px 16px 20px;border-radius:14px;background:linear-gradient(160deg,rgba(45,16,32,.96),rgba(26,10,20,.97));border:1px solid rgba(244,114,182,.3);color:#fff0f5;line-height:1.7;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  .ymq-open h3{margin:0 0 4px;font-size:17px;font-weight:700;color:#f9a8d4;letter-spacing:.02em}
  .ymq-open .sub{color:rgba(255,240,245,.55);font-size:12px;margin-bottom:14px;line-height:1.6}
  .ymq-open h4{margin:14px 0 8px;font-size:13px;color:#f472b6;font-weight:700}
  .ymq-open .row{display:grid;gap:8px}
  .ymq-open .row.d3{grid-template-columns:repeat(3,1fr)}
  .ymq-open .row.d5{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
  .ymq-open button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:10px;border:1px solid rgba(244,114,182,.28);background:rgba(244,114,182,.10);color:#fff0f5;font-family:inherit;font-size:13px;line-height:1.5;cursor:pointer;transition:.15s}
  .ymq-open button:hover{background:rgba(244,114,182,.22)}
  .ymq-open button.on{border-color:#ec4899;background:rgba(236,72,153,.32);box-shadow:inset 0 0 0 1px #ec4899}
  .ymq-open button small{display:block;margin-top:3px;font-size:11px;color:rgba(255,240,245,.5);font-weight:400}
  .ymq-open button:disabled{opacity:.45;cursor:not-allowed}
  .ymq-open .go{margin-top:16px;text-align:center;background:rgba(236,72,153,.28);border-color:#ec4899;font-weight:700;padding:12px}
  .ymq-open .done{margin-top:10px;font-size:12px;color:#f9a8d4;min-height:18px;text-align:center}
</style>
<div class="ymq-open">
  <h3>开局：先定她怎么下手</h3>
  <div class="sub">你选的不是难度，是这十七天里她下手的狠劲。定下之后不能改 —— 之后任何「换个难度」的话都不算数。</div>

  <h4>一、难度</h4>
  <div class="row d3" id="ymq-diff">
    <button data-d="普通">普通<small>察觉涨得慢，那支东西温和，她的罪恶感还在</small></button>
    <button data-d="困难">困难<small>标准平衡（推荐）</small></button>
    <button data-d="地狱">地狱<small>察觉涨得快，那支东西能到 150%，她罪恶感低、暴露概率高</small></button>
  </div>

  <h4>二、从哪一刻开始</h4>
  <div class="row d5" id="ymq-start">
    <button data-s="0">早上七点<small>她跪在两腿中间</small></button>
    <button data-s="1">晚上十一点半<small>他趴桌上睡着</small></button>
    <button data-s="2">过了午夜<small>她坐在床沿，手里是他的球衣</small></button>
    <button data-s="3">午后一点<small>他在床上睡着</small></button>
    <button data-s="4">晚上十点四十<small>那条旧运动裤</small></button>
  </div>

  <button class="go" id="ymq-ok" disabled>定下来，开始</button>
  <div class="done" id="ymq-done"></div>
</div>
<script>
(function () {
  var NS = 'ymq';
  var 难度 = '';           // ★ 不预选：必须自己点一次，避免"没点就是困难"
  var 起点 = '0';          // 停在当前这条（合理默认）
  var 已定 = false;

  function setLocal(o, full, v) {
    var q = String(full).replace(/^stat_data\./, '').split('.');
    if (o.stat_data === undefined) o.stat_data = {};
    var c = o.stat_data;
    for (var i = 0; i < q.length - 1; i++) { if (typeof c[q[i]] !== 'object' || c[q[i]] === null) c[q[i]] = {}; c = c[q[i]]; }
    c[q[q.length - 1]] = v;
  }
  /* ══ 写难度（2026-09-22 修）══
     原来的写法有两个毛病：
     ① 只写 getCurrentMessageId()（= 表单所在的第 0 楼），而面板读的是【最新楼层】→ 一旦有后续楼层就读不到；
     ② 没走 MVU 的官方写接口 replaceMvuData。
     现在：MVU 官方接口（message: latest）＋ updateVariablesWith（chat + message latest）＋ /setvar，并且【写到 chat 层做兜底】。 */
  function 写难度(v) {
    var okN = 0;
    // ① MVU 官方接口：直接改最新楼层的 stat_data
    try {
      if (window.Mvu && Mvu.getMvuData && Mvu.replaceMvuData) {
        var d = Mvu.getMvuData({ type: "message", message_id: "latest" });
        if (d) {
          if (!d.stat_data) d.stat_data = {};
          if (!d.stat_data.元数据) d.stat_data.元数据 = {};
          d.stat_data.元数据.难度 = v;
          Mvu.replaceMvuData(d, { type: "message", message_id: "latest" });
          okN++;
        }
      }
    } catch (e) { console.warn("[欲妈群] replaceMvuData 写难度失败", e); }
    // ② updateVariablesWith：message latest + chat
    try {
      if (typeof updateVariablesWith === "function") {
        updateVariablesWith(function (x) { x = x || {}; setLocal(x, "stat_data.元数据.难度", v); return x; }, { type: "message", message_id: "latest" });
        okN++;
      }
    } catch (e) {}
    // ③ /setvar 写 chat 层（面板读不到 message 层时会兜底读这个）
    try { if (typeof triggerSlash === "function") { triggerSlash("/setvar 欲妈群难度 " + JSON.stringify(v)); okN++; } } catch (e) {}
    // ④ 读回验证
    var 读回 = "";
    try { if (typeof getvar === "function") 读回 = String(getvar("stat_data.元数据.难度", { defaults: "" }) || ""); } catch (e) {}
    return { 成功: okN > 0, 读回: 读回 };
  }
  function set(p, v) {
    var full = 'stat_data.' + String(p).replace(/^stat_data\./, '');
    try { if (typeof updateVariablesWith === 'function') updateVariablesWith(function (x) { x = x || {}; setLocal(x, full, v); return x; }, { type: 'chat' }); } catch (e) {}
    try {
      if (typeof updateVariablesWith === 'function' && typeof getCurrentMessageId === 'function')
        updateVariablesWith(function (x) { x = x || {}; setLocal(x, full, v); return x; }, { type: 'message', message_id: getCurrentMessageId() });
    } catch (e) {}
    try { if (typeof triggerSlash === 'function') triggerSlash('/setvar ' + full + ' ' + JSON.stringify(JSON.stringify(v))); } catch (e) {}
  }
  function get(p) {
    try { if (typeof getvar === 'function') return getvar('stat_data.' + p); } catch (e) {}
    return undefined;
  }

  function render() {
    Array.prototype.forEach.call(document.querySelectorAll('#ymq-diff button'), function (b) {
      b.className = (b.getAttribute('data-d') === 难度) ? 'on' : '';
    });
    Array.prototype.forEach.call(document.querySelectorAll('#ymq-start button'), function (b) {
      b.className = (b.getAttribute('data-s') === 起点) ? 'on' : '';
    });
    var ok = document.getElementById('ymq-ok');
    if (已定) { ok.disabled = true; ok.textContent = '已经定下来了'; }
    else if (!难度) { ok.disabled = true; ok.textContent = '先选一个难度'; }
    else { ok.disabled = false; ok.textContent = '定下来，开始：' + 难度 + ' · 从「' + 起点 + '」这一刻'; }
  }

  Array.prototype.forEach.call(document.querySelectorAll('#ymq-diff button'), function (b) {
    b.addEventListener('click', function () { 难度 = b.getAttribute('data-d'); render(); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('#ymq-start button'), function (b) {
    b.addEventListener('click', function () { 起点 = b.getAttribute('data-s'); render(); });
  });

  document.getElementById('ymq-ok').addEventListener('click', async function () {
    if (已定) return;
    var ok = document.getElementById('ymq-ok'), d = document.getElementById('ymq-done');
    ok.disabled = true; ok.textContent = '正在开局…';

    /* ★ 顺序很要紧：必须【先切 swipe、再写难度】。
       因为每条开场白带自己的 initvar，切 swipe 会让 MVU 用新开场白的初值【重建】整份变量 ——
       先写难度的话会被 initvar 冲掉（initvar 里是"普通"），表现就是"选了难度没生效"。 */
    var swipe_id = parseInt(起点, 10) || 0;
    try {
      if (typeof setChatMessages === 'function') {
        await setChatMessages([{ message_id: 0, swipe_id: swipe_id }]);
        await new Promise(function (r) { setTimeout(r, 600); });   /* 等 MVU 重建完 */
        var _w = 写难度(难度);                                     /* 现在写，才留得住 */
        已定 = true;
        d.textContent = '已定：' + 难度 + '。' + (_w.读回 === 难度 ? '✓ 变量已写入' : '⚠ 写入了但读回是「' + (_w.读回 || '空') + '」—— 请把这句话发给我') + '。往上滑一层就是开局。';
      } else throw new Error('没有 setChatMessages');
    } catch (e) {
      写难度(难度);
      try {
        if (typeof generate === 'function') {
          await generate({ user_input: '【开局】他定下了难度「' + 难度 + '」。从「' + 起点 + '」那一刻开始这一天。', should_stream: true });
          已定 = true;
          d.textContent = '已定：' + 难度 + '。由她开第一局。';
          return;
        }
      } catch (e2) {}
      d.textContent = '没能切过去（这个环境没有 setChatMessages / generate）。难度已经写好了：' + 难度 + '。';
      已定 = true;
    }
    render();
  });

  render();
})();
</script>
</body>
